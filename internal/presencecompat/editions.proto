edition = "2023";

package presencecompat.editions;

enum ClosedState {
  option features.enum_type = CLOSED;

  CLOSED_STATE_UNSPECIFIED = 0;
  CLOSED_STATE_READY = 1;
}

message Message {
  int32 explicit_number = 1;
  string explicit_text = 2;
  bytes explicit_data = 3;
  int32 implicit_number = 4 [features.field_presence = IMPLICIT];
  string implicit_text = 5 [features.field_presence = IMPLICIT];
  bytes implicit_data = 6 [features.field_presence = IMPLICIT];
  repeated int32 packed_numbers = 7;
  repeated int32 expanded_numbers = 8 [features.repeated_field_encoding = EXPANDED];
  Nested nested = 9 [features.message_encoding = DELIMITED];
  ClosedState closed_state = 10;
  repeated ClosedState closed_states = 11;

  oneof closed_selection {
    ClosedState selected_closed_state = 12;
  }
}

message Nested {
  int32 value = 1;
}

message RequiredMessage {
  int32 required_number = 1 [features.field_presence = LEGACY_REQUIRED];
}

message RequiredParent {
  RequiredMessage child = 1;
}
